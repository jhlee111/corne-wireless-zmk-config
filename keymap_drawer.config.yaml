# keymap-drawer 설정 — .github/workflows/draw.yml 이 keymap-drawer/corne.svg 를 그린다.
# 기본값은 `keymap dump-config` 참고. 여기엔 바꾼 것만 둔다.
parse_config:
  # macOS 기호로 모디파이어 표시
  modifier_fn_map:
    left_ctrl: "⌃"
    right_ctrl: "⌃"
    left_shift: "⇧"
    right_shift: "⇧"
    left_alt: "⌥"
    right_alt: "AltGr"
    left_gui: "⌘"
    right_gui: "⌘"
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"
  zmk_keycode_map:
    LGUI: "⌘"
    RGUI: "⌘"
    LALT: "⌥"
    RALT: {t: AltGr, type: word}
    LCTRL: {t: Ctrl, type: word}
    RCTRL: {t: Ctrl, type: word}
    LSHFT: "⇧"
    RSHFT: "⇧"
    ESCAPE: {t: Esc, type: word}
    ESC: {t: Esc, type: word}
    ENTER: "⏎"
    SPACE: "␣"
    BSPC: "⌫"
    BACKSPACE: "⌫"
    DEL: "⌦"
    TAB: "⇥"
    CAPS: {t: Caps, type: word}
    LEFT_ARROW: "←"
    LEFT: "←"
    RIGHT: "→"
    RIGHT_ARROW: "→"
    UP_ARROW: "↑"
    UP: "↑"
    DOWN_ARROW: "↓"
    DOWN: "↓"
    PAGE_UP: {t: PgUp, type: word}
    PAGE_DOWN: {t: PgDn, type: word}
    C_MUTE: {t: Mute, type: word}
    C_VOL_DN: {t: Vol-, type: word}
    C_VOL_UP: {t: Vol+, type: word}
    C_PREV: {t: Prev, type: word}
    C_NEXT: {t: Next, type: word}
    C_PLAY_PAUSE: {t: Play, type: word}
    KP_MULTIPLY: "*"
    KP_PLUS: "+"
    KP_MINUS: "-"
    KP_DIVIDE: /
    KP_ENTER: "⏎"
    SEMI: ";"
    SINGLE_QUOTE: "'"
    COMMA: ","
    DOT: "."
    SLASH: /
    BACKSLASH: '\'
    HOME: {t: Home, type: word}
    END: {t: End, type: word}
    # keymap-drawer 기본 기호 매핑 (이 맵을 정의하면 기본값이 통째로 대체되므로 함께 둔다)
    AMPERSAND: '&'
    AMPS: '&'
    APOS: ''''
    APOSTROPHE: ''''
    ASTERISK: '*'
    ASTRK: '*'
    AT: '@'
    AT_SIGN: '@'
    BSLH: '\'
    CARET: '^'
    COLON: ':'
    DLLR: '$'
    DOLLAR: '$'
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: '='
    EXCL: '!'
    EXCLAMATION: '!'
    FSLH: '/'
    GRAVE: '`'
    GREATER_THAN: '>'
    GT: '>'
    HASH: '#'
    LBKT: '['
    LBRC: '{'
    LEFT_BRACE: '{'
    LEFT_BRACKET: '['
    LEFT_PARENTHESIS: '('
    LESS_THAN: '<'
    LPAR: '('
    LT: '<'
    MINUS: '-'
    NON_US_BACKSLASH: '\'
    NON_US_BSLH: '|'
    NON_US_HASH: '#'
    NUHS: '#'
    PERCENT: '%'
    PERIOD: '.'
    PIPE: '|'
    PIPE2: '|'
    PLUS: +
    POUND: '#'
    PRCNT: '%'
    QMARK: '?'
    QUESTION: '?'
    RBKT: ']'
    RBRC: '}'
    RIGHT_BRACE: '}'
    RIGHT_BRACKET: ']'
    RIGHT_PARENTHESIS: ')'
    RPAR: ')'
    SEMICOLON: ';'
    SQT: ''''
    STAR: '*'
    TILDE: '~'
    TILDE2: '~'
    UNDER: '_'
    UNDERSCORE: '_'
    F1: {t: F1, type: word}
    F2: {t: F2, type: word}
    F3: {t: F3, type: word}
    F4: {t: F4, type: word}
    F5: {t: F5, type: word}
    F6: {t: F6, type: word}
    F7: {t: F7, type: word}
    F8: {t: F8, type: word}
    F9: {t: F9, type: word}
    F10: {t: F10, type: word}
    F11: {t: F11, type: word}
    F12: {t: F12, type: word}
    F13: {t: F13, type: word}
    F14: {t: F14, type: word}
    F15: {t: F15, type: word}
    F16: {t: F16, type: word}
    F17: {t: F17, type: word}
    F18: {t: F18, type: word}
    F19: {t: F19, type: word}
    F20: {t: F20, type: word}
    F21: {t: F21, type: word}
    F22: {t: F22, type: word}
    F23: {t: F23, type: word}
    F24: {t: F24, type: word}
  raw_binding_map:
    # hold-tap 은 tap 쪽 type 을 버리므로 직접 지정
    "&u_lt 5 ESC": {t: Esc, h: Fun, type: word}
    "&mo 6": {t: BT, type: word}
    "&td_cw_whisper": {t: CapsWord, s: "2x: ⌘⇧Z", type: word}
    "&u_cmd_shift_z": "⌘⇧Z"
    "&u_mac_bt_0": {t: BT0, s: Mac, type: word}
    "&u_win_bt_2": {t: BT2, s: Win, type: word}
    "&u_screen_capture_select": {t: Capture, type: word}
    "&soft_off": {t: "Off", type: word}
    "&bootloader": {t: Boot, type: word}
    "&bt BT_CLR": {t: BT Clear, type: word}
    "&bt BT_SEL 1": {t: BT1, type: word}
    "&bt BT_SEL 3": {t: BT3, type: word}
    "&bt BT_SEL 4": {t: BT4, type: word}
    "&to 0": {t: Mac, s: layer, type: word}
    "&to 1": {t: Win, s: layer, type: word}
  zmk_combos:
    b_key_from_right: {l: [Base]}
draw_config:
  key_h: 60
  # 9자 이상은 잘라내고, 6자 이상은 자동 축소
  shrink_wide_legends: 5
  # 기호·한 글자 키는 크게, type: word 로 표시한 단어 키는 작게
  svg_extra_style: |
    text.tap { font-size: 18px; }
    text.tap.word { font-size: 12px; }
  dark_mode: auto
